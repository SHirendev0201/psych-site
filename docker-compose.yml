services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: local_root_password
      MYSQL_DATABASE: psych_site
      MYSQL_USER: psych_user
      MYSQL_PASSWORD: local_dev_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "psych_user", "-plocal_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
