  <main id="main">
    <div id="view-home">
      <div id="reminderSlot"></div>

      <section class="hero container" id="home">
        <div class="hero-copy">
          <div class="eyebrow"><span class="eyebrow-dot"></span> <span data-i18n="hero_eyebrow"></span></div>
          <h1 data-i18n-html="hero_title"></h1>
          <p class="hero-text" data-i18n="hero_text"></p>
          <div class="hero-actions">
            <a class="button button-primary" href="#assessments"><span data-i18n="btn_choose"></span> <span data-ic="next"></span></a>
            <a class="text-link" href="#how"><span data-i18n="link_how"></span> <span data-ic="next" class="rot"></span></a>
          </div>
          <div class="hero-note"><span data-ic="privacy" class="grad"></span> <span data-i18n="hero_note"></span></div>
        </div>
        <div class="hero-art" aria-hidden="true">
          <div class="art-orbit orbit-one"></div>
          <div class="art-orbit orbit-two"></div>
          <div class="art-card">
            <div class="art-top"><span data-i18n="art_top"></span><span class="art-spark" data-ic="growth"></span></div>
            <div class="brain-symbol" data-ic="brain" data-grad="1"></div>
            <div class="art-question" data-i18n-html="art_q"></div>
            <div class="art-bottom"><span class="mini-line"></span><span class="mini-line short"></span><span class="mini-dot"></span></div>
          </div>
          <div class="floating-tag tag-top" data-i18n="tag_top"></div>
          <div class="floating-tag tag-bottom"><span data-ic="heart"></span> <span data-i18n="tag_bottom"></span></div>
          <div class="art-sticker" data-i18n-html="sticker"></div>
        </div>
      </section>

      <section class="trust-strip">
        <div class="container trust-inner">
          <span data-i18n="trust_label"></span>
          <div><span data-ic="success"></span> <span data-i18n="trust_1"></span></div>
          <div><span data-ic="info"></span> <span data-i18n="trust_2"></span></div>
          <div><span data-ic="security"></span> <span data-i18n="trust_3"></span></div>
        </div>
      </section>

      <section class="section container" id="assessments">
        <div class="section-heading">
          <div>
            <div class="eyebrow" data-i18n="tests_eyebrow"></div>
            <h2 data-i18n="tests_title"></h2>
            <p data-i18n="tests_text"></p>
          </div>
          <span class="section-index">01 / 03</span>
        </div>
        <div class="assessment-grid">
          <article class="assessment-card featured">
            <div class="card-top"><span class="card-label" data-i18n="card_main"></span><span class="card-icon" data-ic="brain"></span></div>
            <div class="card-illustration mental-illustration"><span class="bubble bubble-a"></span><span class="bubble bubble-b"></span><span class="face" data-ic="mood"></span></div>
            <h3 data-i18n="mental_title"></h3>
            <p data-i18n="mental_text"></p>
            <div class="card-meta"><span data-ic="history"></span><span data-i18n="mental_meta"></span></div>
            <a href="#/test/mental" class="card-link"><span id="mentalCta" data-i18n="btn_start"></span> <span data-ic="next"></span></a>
          </article>
          <article class="assessment-card">
            <div class="card-top"><span class="card-label muted-label" data-i18n="card_extra"></span><span class="card-icon pale-icon" data-ic="tests"></span></div>
            <div class="card-illustration iq-illustration"><span class="shape shape-one"></span><span class="shape shape-two"></span><span class="shape shape-three"></span><span class="shape shape-four"></span></div>
            <h3 data-i18n="iq_title"></h3>
            <p data-i18n="iq_text"></p>
            <div class="card-meta"><span data-ic="history"></span><span data-i18n="iq_meta"></span></div>
            <a href="#/test/iq" class="card-link"><span id="iqCta" data-i18n="btn_start"></span> <span data-ic="next"></span></a>
          </article>
        </div>
      </section>

      <section class="section container checkin-section" id="checkin">
        <div class="split">
          <div>
            <div class="eyebrow" data-i18n="ck_eyebrow"></div>
            <h2 class="h2" data-i18n="ck_title"></h2>
            <p class="lead" data-i18n="ck_text"></p>
          </div>
          <div class="panel">
            <div class="mood-row" id="moodRow" role="radiogroup"></div>
            <div class="mood-week" id="moodWeek"></div>
          </div>
        </div>
      </section>

          <button class="button button-primary" id="breatheOpen" type="button"><span data-ic="play"></span> <span data-i18n="rx_btn"></span></button>
        </div>
      </section>
